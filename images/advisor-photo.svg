<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFC107;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8F00;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGradient)"/>
  
  <!-- Professional silhouette -->
  <!-- Head -->
  <circle cx="200" cy="130" r="50" fill="#1A1A1A" opacity="0.8"/>
  
  <!-- Body/Suit -->
  <rect x="160" y="180" width="80" height="120" rx="0" ry="0" fill="#1A1A1A" opacity="0.8"/>
  
  <!-- Suit Jacket -->
  <path d="M150 180 Q150 175 155 175 L245 175 Q250 175 250 180 L250 220 L230 240 L230 280 L170 280 L170 240 L150 220 Z" fill="#2C2C2C" opacity="0.9"/>
  
  <!-- Tie -->
  <rect x="185" y="175" width="30" height="80" fill="#FFC107"/>
  <polygon points="200,255 190,265 210,265" fill="#FF8F00"/>
  
  <!-- Collar -->
  <path d="M175 175 L200 200 L225 175" stroke="#1A1A1A" stroke-width="3" fill="none"/>
  
  <!-- Professional text -->
  <text x="200" y="330" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1A1A1A" text-anchor="middle">Professional</text>
  <text x="200" y="355" font-family="Arial, sans-serif" font-size="18" fill="#1A1A1A" text-anchor="middle">Insurance Advisor</text>
  <text x="200" y="375" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">Replace with your photo</text>
</svg>